name: scanfuse CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python: [ "3.12", "3.13" ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies (locked)
        run: uv sync --locked --extra dev

      - name: Ruff
        shell: bash
        run: .github/scripts/run-with-annotations.sh "ruff" uv run ruff check .

      - name: MyPy
        shell: bash
        run: .github/scripts/run-with-annotations.sh "mypy" uv run mypy scanfuse

      - name: Pytest
        shell: bash
        run: .github/scripts/run-with-annotations.sh "pytest" uv run pytest tests/ -q -rs

      - name: Build wheel and source package
        run: uv build --out-dir dist

      - name: Install the wheel in a clean environment and run it outside the source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          if [ -d "$RUNNER_TEMP/smoke/Scripts" ]; then bin="$RUNNER_TEMP/smoke/Scripts"; else bin="$RUNNER_TEMP/smoke/bin"; fi
          "$bin/python" -m pip install --quiet dist/*.whl
          mkdir "$RUNNER_TEMP/smoke-run"
          cd "$RUNNER_TEMP/smoke-run"
          "$bin/scanfuse" --version
          "$bin/scanfuse" "$GITHUB_WORKSPACE"/tests/fixtures/dummy_zap.xml "$GITHUB_WORKSPACE"/tests/fixtures/dummy_burp_view.xml -o report
          test -f report/index.md
          test -f report/report.html
          grep -q "Reported by" report/sql-injection.md

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audit runtime dependencies
        run: |
          python -m pip install uv pip-audit
          uv export --locked --no-dev --no-emit-project --no-hashes -o requirements.txt
          pip-audit -r requirements.txt --no-deps --disable-pip

  standalone:
    name: Standalone program (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest Ubuntu available so that it runs on more Linux systems.
          - { os: ubuntu-22.04, name: linux-x86_64, exe: scanfuse, archive: scanfuse-linux-x86_64.tar.gz }
          - { os: windows-latest, name: windows-x86_64, exe: scanfuse.exe, archive: scanfuse-windows-x86_64.zip }
          - { os: macos-latest, name: macos-arm64, exe: scanfuse, archive: scanfuse-macos-arm64.tar.gz }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install uv and dependencies
        run: |
          python -m pip install uv
          uv sync --locked --extra dev
      - name: Build the program
        run: uv run python build.py
      - name: Run the packaged-program tests
        shell: bash
        env:
          SCANFUSE_EXE: ${{ github.workspace }}/dist/${{ matrix.exe }}
        run: .github/scripts/run-with-annotations.sh "packaged tests" uv run pytest tests/test_packaged_cli.py -q -rs
      - name: Package
        shell: bash
        run: |
          mkdir pkg
          cp "dist/${{ matrix.exe }}" LICENSE README.md pkg/
          uv run python tools/third_party_licenses.py > pkg/THIRD_PARTY_LICENSES.txt
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd pkg && 7z a -tzip "../${{ matrix.archive }}" . > /dev/null)
          else
            tar -czf "${{ matrix.archive }}" -C pkg .
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  packages:
    name: Wheel and source package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python -c 'import re;print(re.search(r"__version__ = \"(.+?)\"", open("scanfuse/__init__.py").read()).group(1))')"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-packages
          path: dist/*
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [ test, audit, standalone, packages ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted publishing: no token. The project on PyPI must trust this workflow and environment.
    environment:
      name: pypi
      url: https://pypi.org/project/scanfuse/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    name: Checksums and GitHub release
    needs: [ test, audit, standalone, packages ]
    # Tags create the release. A manual run (workflow_dispatch) runs everything up to the release step as a dry run.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk -v v="$version" 'index($0, "## " v " ") == 1 {f=1; next} /^## / {if (f) exit} f' CHANGELOG.md > release-notes.md
          cat release-notes.md
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then test -s release-notes.md; fi
          printf '\n### Install\n\n```bash\npipx install scanfuse==%s\n```\n\nStandalone programs for Linux, Windows and macOS are attached below. Check them against `SHA256SUMS`.\n' "$version" >> release-notes.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Create SHA256SUMS
        working-directory: artifacts
        run: |
          ls -l
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: scanfuse ${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
