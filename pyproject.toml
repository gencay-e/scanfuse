[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scanfuse"
dynamic = ["version"]
description = "Fast, local-first pentest finding extractor & markdown report engine."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gencay" }
]
keywords = ["pentest", "security", "report", "nmap", "nuclei", "zap", "burp", "nessus", "trivy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12.0,<1",
    "rich>=13.7.0,<16",
    "pydantic>=2.7.0,<3",
    "defusedxml>=0.7.1,<1",
    "jinja2>=3.1.3,<4",
    "markdown>=3.11,<4",
    "nh3>=0.3.7,<1",
    "pyyaml>=6.0.1,<7",
]

[project.urls]
Repository = "https://github.com/gencay-e/scanfuse"
Changelog = "https://github.com/gencay-e/scanfuse/blob/main/CHANGELOG.md"

[project.scripts]
scanfuse = "scanfuse.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pyinstaller>=6.5.0",
]

[tool.hatch.build.targets.sdist]
exclude = ["/_project", "/AGENTS.md", "/renovate.json", "/.github", "/.forgejo", "/.hypothesis", "/build", "/dist"]

[tool.hatch.version]
path = "scanfuse/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S"]
ignore = ["E501", "S701"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
ignore_missing_imports = true
